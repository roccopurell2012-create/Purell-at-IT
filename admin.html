<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin — IT Ticket Desk</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-card">
    <h1>Admin access</h1>
    <p>Enter the access code to view tickets.</p>
    <form id="gate-form">
      <input type="password" inputmode="numeric" id="gate-code" maxlength="12" autocomplete="off" placeholder="••••">
      <div class="err" id="gate-err"></div>
      <button type="submit" class="submit-btn" style="width:100%;">Enter</button>
    </form>
  </div>
</div>

<div class="admin-shell" id="admin-shell">
  <div class="session-banner" id="session-banner" style="display:none;"></div>
  <header class="admin-header">
    <div class="admin-header-inner">
      <h1>Ticket dashboard</h1>
      <a href="index.html">← Back to site</a>
    </div>
  </header>
  <main class="admin-main">

    <div class="chart-wrap">
      <h3>Tickets by day (last 7 days)</h3>
      <div class="bar-chart" id="chart-by-day"></div>
    </div>

    <div id="flagged-wrap"></div>

    <div class="admin-toolbar">
      <div class="admin-filters" id="admin-filters">
        <button data-filter="all" aria-selected="true">All</button>
        <button data-filter="open" aria-selected="false">Open</button>
        <button data-filter="in-progress" aria-selected="false">In progress</button>
        <button data-filter="fixed" aria-selected="false">Fixed</button>
      </div>
      <div class="admin-toolbar-actions">
        <select id="category-filter" class="status-select">
          <option value="">All categories</option>
          <option value="hardware">Hardware</option>
          <option value="software">Software</option>
          <option value="network">Network</option>
          <option value="account">Account / access</option>
        </select>
        <button class="btn-ghost" id="export-csv">Export CSV</button>
      </div>
    </div>

    <div class="bulk-bar" id="bulk-bar">
      <span id="bulk-count">0 selected</span>
      <select id="bulk-status">
        <option value="open">Open</option>
        <option value="in-progress">In progress</option>
        <option value="fixed">Fixed</option>
      </select>
      <button id="bulk-apply">Apply to selected</button>
    </div>

    <div id="table-wrap">
      <div class="loading">Loading tickets…</div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal-card" id="modal-card"></div>
</div>

<script src="admin.js"></script>
</body>
</html>
